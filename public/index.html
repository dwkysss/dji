<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dentelle Jaya Infinitex</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0070bc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 700; }
    p { margin: 0; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>DENTELLE JAYA INFINITEX</h2>
  <p id="statusTxt">Menghubungkan ke sistem produksi...</p>
  <div style="margin-top: 24px;">
    <a href="offline.html" style="color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.4); padding: 8px 16px; border-radius: 9999px; background: rgba(56, 189, 248, 0.1);">
      Buka Portal Offline Langsung &rarr;
    </a>
  </div>

  <script>
    // Smart router: otomatis alihkan ke offline.html jika offline, atau /input jika online
    (function() {
      if (!navigator.onLine) {
        window.location.replace("offline.html");
      } else {
        // Cek konektivitas ke server lokal / remote
        fetch("/api/mobile/bootstrap")
          .then(res => {
            if (res.ok) {
              window.location.replace("/input");
            } else {
              window.location.replace("offline.html");
            }
          })
          .catch(() => {
            window.location.replace("offline.html");
          });
      }
    })();
  </script>
</body>
</html>
